<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .phone { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .bar { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; }
      .card { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1; }
      .muted { fill: #6b7280; font: 12px system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .text { fill: #111827; font: 14px system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .title { fill: #111827; font: 16px system-ui, -apple-system, Segoe UI, Roboto, Arial; font-weight: 700; }
      .h1 { fill: #111827; font: 18px system-ui, -apple-system, Segoe UI, Roboto, Arial; font-weight: 800; }
      .btn { fill: #e5e7eb; stroke: #6b7280; stroke-width: 1; }
      .chip { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1; }
      .icon { fill: #111827; font: 14px system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .small { fill: #111827; font: 12px system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    </style>
  </defs>

  <g transform="translate(40,40)">
    <rect class="phone" x="0" y="0" rx="18" ry="18" width="220" height="420"/>
    <rect class="bar" x="0" y="0" rx="18" ry="18" width="220" height="50"/>
    <text class="title" x="12" y="30">Splash</text>
    <rect class="chip" x="60" y="110" width="100" height="100" rx="12"/>
    <text class="text" x="70" y="165">Logo</text>
    <text class="h1" x="70" y="245">FitLife</text>
    <text class="muted" x="45" y="270">Your Fitness Companion</text>
    <rect class="btn" x="70" y="310" width="80" height="22" rx="10"/>
    <text class="muted" x="86" y="326">Loading…</text>
  </g>

  <g transform="translate(300,40)">
    <rect class="phone" x="0" y="0" rx="18" ry="18" width="220" height="420"/>
    <rect class="bar" x="0" y="0" rx="18" ry="18" width="220" height="50"/>
    <text class="title" x="12" y="30">Login</text>
    <text class="h1" x="52" y="95">Welcome Back</text>
    <rect class="card" x="18" y="125" width="184" height="42" rx="10"/><text class="muted" x="28" y="150">Email</text>
    <rect class="card" x="18" y="178" width="184" height="42" rx="10"/><text class="muted" x="28" y="203">Password</text>
    <rect class="btn" x="18" y="235" width="184" height="40" rx="10"/><text class="text" x="98" y="260">Login</text>
    <text class="muted" x="32" y="305">Register</text>
  </g>

  <g transform="translate(560,40)">
    <rect class="phone" x="0" y="0" rx="18" ry="18" width="220" height="420"/>
    <rect class="bar" x="0" y="0" rx="18" ry="18" width="220" height="50"/>
    <text class="title" x="12" y="30">Register</text>
    <text class="h1" x="46" y="95">Create Account</text>
    <rect class="card" x="18" y="120" width="184" height="34" rx="10"/><text class="muted" x="28" y="142">Name</text>
    <rect class="card" x="18" y="162" width="184" height="34" rx="10"/><text class="muted" x="28" y="184">Email</text>
    <rect class="card" x="18" y="204" width="184" height="34" rx="10"/><text class="muted" x="28" y="226">Phone</text>
    <rect class="card" x="18" y="246" width="184" height="34" rx="10"/><text class="muted" x="28" y="268">Password</text>
    <rect class="card" x="18" y="288" width="184" height="34" rx="10"/><text class="muted" x="28" y="310">Confirm</text>
    <rect class="btn" x="18" y="336" width="184" height="40" rx="10"/><text class="text" x="86" y="361">Register</text>
  </g>

  <g transform="translate(820,40)">
    <rect class="phone" x="0" y="0" rx="18" ry="18" width="220" height="420"/>
    <rect class="bar" x="0" y="0" rx="18" ry="18" width="220" height="50"/>
    <text class="icon" x="12" y="30">☰</text>
    <text class="title" x="40" y="30">Dashboard</text>
    <rect class="card" x="14" y="62" width="192" height="64" rx="12"/>
    <text class="text" x="24" y="88">Welcome, Name!</text>
    <text class="muted" x="24" y="108">Stats: total • completed</text>

    <rect class="card" x="14" y="136" width="192" height="64" rx="12"/>
    <text class="text" x="24" y="162">Daily Motivation</text>
    <text class="muted" x="24" y="182">“Short quote…”</text>

    <text class="text" x="14" y="226">Your Workouts</text>
    <rect class="btn" x="140" y="212" width="66" height="22" rx="10"/><text class="small" x="154" y="228">Create</text>

    <rect class="card" x="14" y="244" width="192" height="74" rx="12"/>
    <text class="text" x="24" y="270">Workout Card</text>
    <text class="muted" x="24" y="290">Desc…</text>
    <text class="muted" x="24" y="310">Swipe: → complete, ← delete</text>

    <rect class="card" x="14" y="326" width="192" height="74" rx="12"/>
    <text class="text" x="24" y="352">Workout Card</text>
    <text class="muted" x="24" y="372">Desc…</text>

    <circle class="btn" cx="186" cy="388" r="18"/><text class="text" x="180" y="394">+</text>
  </g>

  <g transform="translate(40,500)">
    <rect class="phone" x="0" y="0" rx="18" ry="18" width="220" height="420"/>
    <rect class="bar" x="0" y="0" rx="18" ry="18" width="220" height="50"/>
    <text class="icon" x="12" y="30">←</text>
    <text class="title" x="40" y="30">My Workouts</text>

    <rect class="chip" x="14" y="64" width="192" height="26" rx="10"/><text class="text" x="24" y="82">⌛ Incomplete</text>
    <rect class="card" x="14" y="98" width="192" height="74" rx="12"/><text class="text" x="24" y="124">Workout Card</text><text class="muted" x="24" y="144">Swipe gestures</text>
    <rect class="card" x="14" y="180" width="192" height="74" rx="12"/><text class="text" x="24" y="206">Workout Card</text>

    <rect class="chip" x="14" y="266" width="192" height="26" rx="10"/><text class="text" x="24" y="284">✓ Completed</text>
    <rect class="card" x="14" y="300" width="192" height="74" rx="12"/><text class="text" x="24" y="326">Workout Card</text><text class="muted" x="24" y="346">Completed badge</text>
  </g>

  <g transform="translate(300,500)">
    <rect class="phone" x="0" y="0" rx="18" ry="18" width="220" height="420"/>
    <rect class="bar" x="0" y="0" rx="18" ry="18" width="220" height="50"/>
    <text class="icon" x="12" y="30">←</text>
    <text class="title" x="40" y="30">Create Workout</text>

    <rect class="card" x="14" y="62" width="192" height="80" rx="12"/><text class="muted" x="24" y="100">Image preview</text>
    <rect class="btn" x="122" y="114" width="70" height="20" rx="10"/><text class="muted" x="134" y="129">Add</text>

    <rect class="card" x="14" y="152" width="192" height="38" rx="10"/><text class="muted" x="24" y="176">Workout name</text>
    <rect class="card" x="14" y="198" width="192" height="58" rx="10"/><text class="muted" x="24" y="226">Description</text>

    <text class="text" x="14" y="280">Exercises</text>
    <rect class="btn" x="118" y="266" width="88" height="22" rx="10"/><text class="muted" x="126" y="282">+ Add</text>

    <rect class="card" x="14" y="296" width="192" height="44" rx="10"/><text class="muted" x="24" y="322">Exercise item</text>
    <rect class="btn" x="14" y="356" width="192" height="40" rx="10"/><text class="text" x="98" y="381">Save</text>
  </g>

  <g transform="translate(560,500)">
    <rect class="phone" x="0" y="0" rx="18" ry="18" width="220" height="420"/>
    <rect class="bar" x="0" y="0" rx="18" ry="18" width="220" height="50"/>
    <text class="icon" x="12" y="30">←</text>
    <text class="title" x="40" y="30">Workout Detail</text>
    <text class="h1" x="14" y="84">Workout Name</text>
    <rect class="card" x="14" y="104" width="192" height="54" rx="10"/><text class="muted" x="24" y="134">Exercise list item</text>
    <rect class="card" x="14" y="166" width="192" height="54" rx="10"/><text class="muted" x="24" y="196">Exercise list item</text>
    <rect class="card" x="14" y="228" width="192" height="54" rx="10"/><text class="muted" x="24" y="258">Exercise list item</text>
  </g>

  <g transform="translate(820,500)">
    <rect class="phone" x="0" y="0" rx="18" ry="18" width="220" height="420"/>
    <rect class="bar" x="0" y="0" rx="18" ry="18" width="220" height="50"/>
    <text class="icon" x="12" y="30">←</text>
    <text class="title" x="40" y="30">Delegate Workout</text>
    <rect class="card" x="14" y="78" width="192" height="44" rx="10"/><text class="muted" x="24" y="104">Recipient phone</text>
    <rect class="card" x="14" y="132" width="192" height="44" rx="10"/><text class="muted" x="24" y="158">Recipient email</text>
    <rect class="btn" x="14" y="190" width="192" height="40" rx="10"/><text class="text" x="78" y="215">Send SMS</text>
    <rect class="btn" x="14" y="238" width="192" height="40" rx="10"/><text class="text" x="72" y="263">Send Email</text>
  </g>

  <g transform="translate(1080,40)">
    <rect class="phone" x="0" y="0" rx="18" ry="18" width="220" height="420"/>
    <rect class="bar" x="0" y="0" rx="18" ry="18" width="220" height="50"/>
    <text class="icon" x="12" y="30">←</text>
    <text class="title" x="40" y="30">My Profile</text>
    <circle class="chip" cx="110" cy="110" r="38"/><text class="muted" x="88" y="116">Avatar</text>
    <rect class="card" x="14" y="170" width="192" height="34" rx="10"/><text class="muted" x="24" y="192">Name: …</text>
    <rect class="card" x="14" y="210" width="192" height="34" rx="10"/><text class="muted" x="24" y="232">Email: …</text>
    <rect class="card" x="14" y="250" width="192" height="34" rx="10"/><text class="muted" x="24" y="272">Phone: …</text>
    <rect class="btn" x="14" y="304" width="192" height="38" rx="10"/><text class="text" x="72" y="328">Edit Profile</text>
    <rect class="btn" x="14" y="348" width="192" height="38" rx="10"/><text class="text" x="58" y="372">Change Password</text>
  </g>

  <g transform="translate(1080,500)">
    <rect class="phone" x="0" y="0" rx="18" ry="18" width="220" height="420"/>
    <rect class="bar" x="0" y="0" rx="18" ry="18" width="220" height="50"/>
    <text class="title" x="12" y="30">Navigation Drawer</text>
    <rect class="card" x="14" y="62" width="192" height="70" rx="12"/>
    <text class="muted" x="24" y="90">Header: Name</text>
    <text class="muted" x="24" y="110">Header: Email</text>
    <text class="text" x="14" y="160">• Home</text>
    <text class="text" x="14" y="185">• My Workouts</text>
    <text class="text" x="14" y="210">• Delegate Tasks</text>
    <text class="text" x="14" y="235">• Profile</text>
    <text class="text" x="14" y="260">• BMI Calculator</text>
    <rect class="chip" x="14" y="280" width="192" height="1"/>
    <text class="text" x="14" y="310">• Light Mode</text>
    <text class="text" x="14" y="335">• Dark Mode</text>
    <text class="text" x="14" y="360">• Logout</text>
  </g>

  <g transform="translate(1340,500)">
    <rect class="phone" x="0" y="0" rx="18" ry="18" width="220" height="420"/>
    <rect class="bar" x="0" y="0" rx="18" ry="18" width="220" height="50"/>
    <text class="icon" x="12" y="30">←</text>
    <text class="title" x="40" y="30">BMI Calculator</text>
    <rect class="card" x="14" y="78" width="192" height="44" rx="10"/><text class="muted" x="24" y="104">Weight (kg)</text>
    <rect class="card" x="14" y="132" width="192" height="44" rx="10"/><text class="muted" x="24" y="158">Height (cm)</text>
    <rect class="btn" x="14" y="190" width="192" height="40" rx="10"/><text class="text" x="68" y="215">Calculate BMI</text>
    <rect class="card" x="14" y="242" width="192" height="90" rx="12"/>
    <text class="text" x="24" y="274">BMI: 23.5</text>
    <text class="muted" x="24" y="298">Category: Normal</text>
  </g>
</svg>
